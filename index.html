<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WordGrid</title>
<style>
  :root{
    --ink:#1B2A49; --board:#22365E; --tile:#F5E9D0; --tile-dim:#E3D5B8; --seed:#F2B134;
    --gold:#F2B134; --coral:#E4572E; --mint:#4FB286; --muted:#9AA8C4;
    --font:"Avenir Next","Segoe UI",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--ink);color:var(--tile);font-family:var(--font);min-height:100%}
  body{display:flex;flex-direction:column;align-items:center;padding:16px 16px 190px}
  h1{font-size:15px;font-weight:600;letter-spacing:.08em;margin:0 0 6px;color:var(--muted)}
  p.lead{margin:0 0 18px;white-space:nowrap;text-align:center;font-size:14px;line-height:1.45;color:var(--tile-dim)}
  .top{display:flex;gap:16px;align-items:center;margin-bottom:16px;flex-wrap:wrap;justify-content:center}
  .count{font-size:14px;color:var(--muted);min-width:18ch;text-align:center}
  .count b{color:var(--tile);font-size:18px}
  .count.dead b{color:var(--coral)}
  .board{background:var(--board);padding:14px;border-radius:16px;display:grid;gap:8px;box-shadow:0 18px 40px rgba(0,0,0,.35);transition:background .2s}
  .board.dead{background:#6E2A1E}
  .board.won{background:#1F5A44;box-shadow:0 0 0 4px var(--gold),0 18px 40px rgba(0,0,0,.35)}
  .cell{width:var(--cw);height:var(--cw);background:var(--tile);color:var(--ink);border-radius:9px;display:flex;align-items:center;justify-content:center;
    font-size:calc(var(--cw)*.52);font-weight:700;text-transform:uppercase;cursor:pointer;user-select:none;
    box-shadow:inset 0 -4px 0 rgba(0,0,0,.12);transition:transform .12s,background .15s}
  .cell.diag{background:var(--tile-dim)}
  .cell.seed{background:var(--seed)}
  .cell.hinted{box-shadow:inset 0 -4px 0 rgba(0,0,0,.12),inset 0 0 0 3px var(--mint)}
  .cell.sel{outline:3px solid #fff;outline-offset:2px}
  .cell.echo{transform:scale(1.08)}
  .cell.ok{background:var(--mint);color:#fff}
  .cell.bad{background:var(--coral);color:#fff}
  .strip{width:100%;max-width:340px;margin-top:12px;background:rgba(255,255,255,.06);border-left:3px solid var(--gold);border-radius:8px;padding:8px 12px;font-size:14px;line-height:1.4;min-height:44px;display:flex;flex-direction:column;gap:2px}
  .strip .where{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
  .strip .text{color:var(--tile)} .strip .text i{color:var(--muted);margin-right:4px}
  .words li.cur{outline:1.5px solid var(--gold)}
  .status{min-height:24px;margin-top:14px;font-size:15px;font-weight:600;text-align:center;max-width:40ch}
  .status.win{color:var(--gold)} .status.warn{color:#FFB199}
  .actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
  .actions button{background:transparent;border:1.5px solid var(--tile-dim);color:var(--tile);padding:9px 14px;border-radius:8px;font:inherit;font-size:14px;cursor:pointer}
  .actions button.primary{background:var(--tile);color:var(--ink);border-color:var(--tile);font-weight:700}
  .actions button:hover{border-color:var(--gold)}
  .actions button:disabled{opacity:.4;cursor:default}
  h2{font-size:13px;font-weight:600;color:var(--muted);margin:22px 0 6px;width:100%;max-width:340px}
  .words{list-style:none;padding:0;margin:0;width:100%;max-width:360px;display:grid;gap:6px}
  .words li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:baseline;font-size:14px;padding:8px 10px;border-radius:6px;background:rgba(255,255,255,.05)}
  .words li .w{letter-spacing:.3em;font-weight:700;text-transform:uppercase;white-space:nowrap;min-width:7.5ch}
  .words li .w em{opacity:.3;font-style:normal}
  .words li .clue{color:var(--muted);line-height:1.35}
  .words li .clue i{color:var(--tile-dim);font-style:italic;margin-right:4px}
  .words li.ok .clue{color:var(--mint)}
  .words li.bad .clue{color:var(--coral)}
  .custom{display:flex;gap:8px;margin-top:12px}
  .custom input{width:16ch;background:rgba(255,255,255,.06);border:1.5px solid var(--muted);color:var(--tile);padding:8px 10px;border-radius:8px;font:inherit;font-size:14px;letter-spacing:.15em;text-transform:uppercase}
  .custom input:focus{outline:none;border-color:var(--gold)}
  .custom input::placeholder{letter-spacing:0;text-transform:none;color:var(--muted)}
  .custom button{background:transparent;border:1.5px solid var(--tile-dim);color:var(--tile);padding:8px 14px;border-radius:8px;font:inherit;font-size:14px;cursor:pointer}
  .hint{margin-top:14px;font-size:12px;color:var(--muted);text-align:center;max-width:44ch;line-height:1.4}
  .kb{position:fixed;left:0;right:0;bottom:0;background:var(--ink);padding:8px 4px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.35);z-index:5}
  .kb .krow{display:flex;justify-content:center;gap:5px;margin-bottom:6px}
  .kb button{flex:0 1 38px;height:46px;background:#2E4470;color:var(--tile);border:0;border-radius:6px;font:inherit;font-size:16px;font-weight:600;text-transform:uppercase;cursor:pointer}
  .kb button.wide{flex-basis:58px;font-size:13px}
  .kb button:active{background:var(--gold);color:var(--ink)}
  @media (prefers-reduced-motion:reduce){.cell,.board{transition:none}}
</style>
</head>
<body>
<h1>WORDGRID</h1>
<p class="lead">Complete the grid so every row is a word.</p>
<div class="top">
  <div class="count" id="count"></div>
</div>
<div class="board" id="board"></div>
<div class="strip" id="strip"><span class="where"></span><span class="text"></span></div>
<div class="status" id="status"></div>
<div class="actions">
  <button class="primary" id="hint">Hint</button>
  <button id="undo">Undo</button>
  <button id="new">New puzzle</button>
</div>
<div class="custom">
  <input id="seedInput" maxlength="5" placeholder="your own 5-letter word" autocomplete="off" autocapitalize="characters" spellcheck="false">
  <button id="seedGo">Start</button>
</div>
<div class="hint">Hints used: <span id="hints">0</span>. Tap a tile, then a key; the mirrored tile fills too. Arrow keys move, ⌫ erases, Ctrl/⌘ Z undoes. Gold tiles are the seed. Clues describe one way to finish the grid and adapt to your letters.</div>
<h2>Current words and clues</h2>
<ul class="words" id="words"></ul>
<div class="kb" id="kb" aria-label="Onscreen keyboard"></div>

function prepareWords(){

  for(let i=W.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[W[i],W[j]]=[W[j],W[i]];}
  idx=Array.from({length:n},()=>({}));
  W.forEach(w=>{for(let p=0;p<n;p++)(idx[p][w[p]]??=[]).push(w);});
}
// Enumerate completions of `fixed` (n×n letters or ''). Calls onSol(rows) per solution; stops when it returns true.
function enumerate(fixed,onSol,budget=BUDGET){

  function cands(r){
    const pat=[];for(let c=0;c<n;c++)pat.push(c<r?out[c][r]:(fixed[r][c]||''));

    for(let c=0;c<n;c++)if(pat[c]){const a=idx[c][pat[c]]||[];if(!base||a.length<base.length){base=a;bp=c;}}
    if(!base)return W;
    return base.filter(w=>{for(let c=0;c<n;c++)if(c!==bp&&pat[c]&&w[c]!==pat[c])return false;return true;});
  }
  function rec(r){
    if(r===n)return onSol(out.slice());
    for(const w of cands(r)){
      if(++nodes>budget){cut=true;return true;}
      if(out.includes(w))continue;
      out.push(w);const stop=rec(r+1);out.pop();
      if(stop)return true;
    }
    return false;
  }
  rec(0);return cut;
}

function findSolution(fixed){

}

  board.style.setProperty('--cw',cw+'px');
  board.style.gridTemplateColumns=`repeat(${n},var(--cw))`;
  board.innerHTML='';cells=[];
  for(let r=0;r<n;r++){cells.push([]);for(let c=0;c<n;c++){
    const d=document.createElement('div');
    d.className='cell'+(r===c?' diag':'');
    d.setAttribute('aria-label',`row ${r+1} column ${c+1}`);
    d.onclick=()=>select(r,c);
    board.appendChild(d);cells[r].push(d);
  }}
  select(1,1);
}
function seedGrid(w){const g=Array.from({length:n},()=>Array(n).fill(''));[...w].forEach((ch,c)=>{g[0][c]=ch;g[c][0]=ch;});return g;}
function select(r,c){if(isSeed(r,c))return;cells.flat().forEach(x=>x.classList.remove('sel'));sel=[r,c];cells[r][c].classList.add('sel');updateStrip();}
function clueFor(r){
  const row=grid[r],full=row.every(Boolean),w=row.join('');
  if(full&&dict.has(w))return ['ok',DEFS[w]];
  if(full)return ['bad',['','not in the word list']];
  return target?['',DEFS[target[r]]]:['',['','']];
}
function updateStrip(){
  const r=sel[0],[cls,[pos,d]]=clueFor(r);
  $('strip').querySelector('.where').textContent=`Row ${r+1} · Column ${r+1}`;
  $('strip').querySelector('.text').innerHTML=`<i>${pos}</i>${d}`;
  document.querySelectorAll('#words li').forEach((li,i)=>li.classList.toggle('cur',i===r));
}
function newPuzzle(custom){
  prepareWords();
  if(custom){
    custom=custom.toLowerCase();
    if(!dict.has(custom)){setStatus(`"${custom.toUpperCase()}" is not in the word list.`,'warn');return;}
    const s=findSolution(seedGrid(custom));
    if(!s){setStatus(`No grid can be built from "${custom.toUpperCase()}".`,'warn');return;}
    seed=custom;target=s;
  }else{
    seed='';
    for(const w of W){const s=findSolution(seedGrid(w));if(s){seed=w;target=s;break;}}
  }
  build();history=[];hints=0;$('hints').textContent=0;
  $('seedInput').value='';
  try{if(location.protocol.startsWith('http'))window.history.replaceState(null,'',custom?'?seed='+seed:location.pathname);}catch(e){}
  [...seed].forEach((ch,c)=>{place(0,c,ch,false);cells[0][c].classList.add('seed');cells[c][0].classList.add('seed');});
  setStatus('');
  refresh();select(1,1);
}
function isSeed(r,c){return r===0||c===0;}
function place(r,c,ch,echo=true){
  grid[r][c]=ch;grid[c][r]=ch;cells[r][c].textContent=ch;cells[c][r].textContent=ch;
  if(echo&&r!==c){const m=cells[c][r];m.classList.add('echo');setTimeout(()=>m.classList.remove('echo'),160);}
}
function move_(r,c,ch,hint=false){           // a recorded, undoable move
  if(isSeed(r,c)||grid[r][c]===ch)return;
  history.push({r,c,prev:grid[r][c],hint});
  place(r,c,ch);
  cells[r][c].classList.toggle('hinted',hint);cells[c][r].classList.toggle('hinted',hint);
  refresh();
}
function undo(){
  const m=history.pop();if(!m)return;
  place(m.r,m.c,m.prev,false);
  cells[m.r][m.c].classList.remove('hinted');cells[m.c][m.r].classList.remove('hinted');
  if(m.hint){hints--;$('hints').textContent=hints;}
  select(m.r,m.c);refresh();
}
function typeLetter(ch){
  const [r,c]=sel;if(isSeed(r,c))return;
  move_(r,c,ch);
  // advance to the next non-seed cell, wrapping rows
  let k=r*n+c+1;while(k<n*n&&isSeed(Math.floor(k/n),k%n))k++;
  if(k<n*n)select(Math.floor(k/n),k%n);
}
function backspace(){
  const [r,c]=sel;
  if(grid[r][c]&&!isSeed(r,c)){move_(r,c,'');return;}
  let k=r*n+c-1;while(k>=0&&isSeed(Math.floor(k/n),k%n))k--;
  if(k<0)return;const pr=Math.floor(k/n),pc=k%n;select(pr,pc);if(grid[pr][pc])move_(pr,pc,'');
}
function moveSel(dr,dc){let [r,c]=sel;do{r+=dr;c+=dc;}while(r>=0&&r<n&&c>=0&&c<n&&isSeed(r,c));if(r>=0&&r<n&&c>=0&&c<n)select(r,c);}
document.addEventListener('keydown',e=>{
  if(document.activeElement===$('seedInput'))return;
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();return;}
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const map={ArrowRight:[0,1],ArrowLeft:[0,-1],ArrowDown:[1,0],ArrowUp:[-1,0]};
  if(map[e.key]){e.preventDefault();moveSel(...map[e.key]);}
  else if(/^[a-z]$/i.test(e.key)){e.preventDefault();typeLetter(e.key.toLowerCase());}
  else if(e.key==='Backspace'){e.preventDefault();backspace();}
});
const kb=$('kb');
['qwertyuiop','asdfghjkl','zxcvbnm'].forEach((row,i)=>{
  const kr=document.createElement('div');kr.className='krow';
  if(i===2){const u=document.createElement('button');u.textContent='undo';u.className='wide';u.onclick=undo;kr.appendChild(u);}
  for(const ch of row){const b=document.createElement('button');b.textContent=ch;b.onclick=()=>typeLetter(ch);kr.appendChild(b);}
  if(i===2){const bs=document.createElement('button');bs.textContent='⌫';bs.className='wide';bs.onclick=backspace;kr.appendChild(bs);}
  kb.appendChild(kr);
});
function rows(){return grid.map(r=>r.join(''));}

/* ---------- feedback ---------- */
function refresh(){
  clearMarks();
  const {count,cut}=countSolutions(grid);
  dead=count===0&&!cut;
  board.classList.toggle('dead',dead);countEl.classList.toggle('dead',dead);
  const label=count>=CAP?'250+':cut?count+'+':String(count);
  countEl.innerHTML=`<b>${label}</b> possible answer${count===1?'':'s'}`;
  if(dead)setStatus('No valid completion from here. Undo or change a letter.','warn');
  else if(status.classList.contains('warn'))setStatus('');
  // keep clues consistent with what has been typed
  const consistent=target&&grid.every((row,r)=>row.every((ch,c)=>!ch||ch===target[r][c]));
  if(!consistent){const s=findSolution(grid);if(s)target=s;}
  const ws=rows(),won=ws.every(w=>w.length===n&&dict.has(w));
  board.classList.toggle('won',won);
  if(won){cells.flat().forEach(c=>c.classList.add('ok'));setStatus('You made a WordGrid!','win');}
  $('hint').disabled=won;
  $('undo').disabled=!history.length;
  renderWords();
}
function renderWords(){
  list.innerHTML='';
  grid.forEach((row,r)=>{
    const li=document.createElement('li');
    const letters=row.map(ch=>ch?ch:'<em>·</em>').join('');
    const [cls,[pos,d]]=clueFor(r);li.className=cls;
    li.innerHTML=`<span class="w">${letters}</span><span class="clue">${pos?`<i>${pos}</i>`:''}${d}</span>`;
    li.onclick=()=>{let c=0;while(c<n&&isSeed(r,c))c++;if(r>0)select(r,Math.max(c,1));};
    list.appendChild(li);
  });
  updateStrip();
}
function clearMarks(){cells.flat().forEach(c=>c.classList.remove('ok','bad'));board.classList.remove('won');status.classList.remove('win');}
function setStatus(t,cls=''){status.textContent=t;status.className='status '+cls;}
function hint(){
  const sol=findSolution(grid);
  if(!sol){setStatus('No valid completion exists from here. Undo a move first.','warn');return;}
  const empty=[];for(let r=1;r<n;r++)for(let c=r;c<n;c++)if(!grid[r][c])empty.push([r,c]);
  if(!empty.length){setStatus('The grid is already full.');return;}
  const [r,c]=empty[Math.random()*empty.length|0];
  hints++;$('hints').textContent=hints;
  move_(r,c,sol[r][c],true);if(!board.classList.contains('won'))setStatus(`Hint placed at row ${r+1}, column ${c+1}.`);select(r,c);
}
/* ---------- wiring ---------- */
$('hint').onclick=hint;$('undo').onclick=undo;$('new').onclick=()=>newPuzzle();
const seedInput=$('seedInput');
const startCustom=()=>{const v=seedInput.value.replace(/[^a-z]/gi,'');if(v.length===5)newPuzzle(v);else setStatus('Enter a 5-letter word.','warn');};
$('seedGo').onclick=startCustom;
seedInput.addEventListener('keydown',e=>{if(e.key==='Enter')startCustom();});
let urlSeed=null;try{urlSeed=new URLSearchParams(location.search).get('seed');}catch(e){}
if(urlSeed&&/^[a-z]{5}$/i.test(urlSeed))newPuzzle(urlSeed);else newPuzzle();
</script>
